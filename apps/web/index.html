<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Learn system design by building, simulating and reviewing architectures."
    />
    <title>System Design Lab</title>
    <script>
      // Apply the saved theme before first paint. Dark is the default; storage may be unavailable.
      (function () {
        var theme = "dark";
        try {
          theme = localStorage.getItem("sdl-theme") || "dark";
        } catch (e) {}
        var dark =
          theme === "dark" || (theme === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.classList.toggle("dark", dark);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
