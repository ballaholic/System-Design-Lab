name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web (lint, typecheck, test, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          # setup-node v5 detects "packageManager" and tries to cache with pnpm before it is installed.
          package-manager-cache: false
      - name: Install pnpm
        run: npm install -g pnpm@$(node -p "require('./package.json').packageManager.split('@')[1]")
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      # Performance budget (150 nodes < 5 ms, 50-point sweep < 100 ms). Shared runners vary, so a miss
      # is reported but doesn't fail the build; the budget is checked locally before release.
      - name: Simulation benchmark (informational)
        continue-on-error: true
        run: pnpm --filter @sdl/simulation bench

  e2e:
    name: Web end-to-end (Playwright, guest mode)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Install pnpm
        run: npm install -g pnpm@$(node -p "require('./package.json').packageManager.split('@')[1]")
      - run: pnpm install --frozen-lockfile
      - name: Install Chromium
        run: pnpm --filter @sdl/web exec playwright install --with-deps chromium
      # Guest mode only: no API or Supabase project is needed.
      - run: pnpm --filter @sdl/web e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: apps/web/test-results/
          retention-days: 7

  server:
    name: API (build, test incl. PostgreSQL)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - run: dotnet tool restore
      - run: dotnet build server/SystemDesignLab.slnx -c Release
      - name: Migrations are up to date with the model
        run: dotnet ef migrations has-pending-model-changes --project server/src/SystemDesignLab.Api --no-build --configuration Release
      # CI=true is set by GitHub Actions, so database tests fail instead of skipping if Docker is unavailable.
      - name: Test (Testcontainers PostgreSQL)
        run: dotnet test --solution server/SystemDesignLab.slnx -c Release --no-build
